name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Unpack and build
        run: |
          unzip -o CloneLite.zip -d work
          cd work/CloneLite
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CloneLite-apk
          path: work/CloneLite/app/build/outputs/apk/debug/app-debug.apk
